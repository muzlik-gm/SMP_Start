name: Production Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Create GitHub Release'
        required: false
        default: 'true'
      version:
        description: 'Version to release (e.g., 1.0.1)'
        required: true

env:
  MAVEN_OPTS: "-Xmx2g -XX:MaxMetaspaceSize=512m"

jobs:
  # Job 1: Validate and prepare
  validate:
    name: Validate Version & Setup
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.version }}
      version_changed: ${{ steps.check_version.outputs.changed }}
      pom_version: ${{ steps.get_pom_version.outputs.pom_version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Get version from tag or input
        id: get_version
        run: |
          if [[ "${{ github.event_name }}" == "push" ]]; then
            VERSION=${GITHUB_REF#refs/tags/v}
          else
            VERSION="${{ github.event.inputs.version }}"
          fi
          
          if [[ -z "$VERSION" ]]; then
            echo "Error: No version provided"
            exit 1
          fi
          
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Using version: $VERSION"

      - name: Get current POM version
        id: get_pom_version
        run: |
          POM_VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          echo "pom_version=$POM_VERSION" >> $GITHUB_OUTPUT
          echo "Current POM version: $POM_VERSION"

      - name: Check if version changed
        id: check_version
        run: |
          TAG_VERSION="${{ steps.get_version.outputs.version }}"
          POM_VERSION="${{ steps.get_pom_version.outputs.pom_version }}"
          
          if [[ "$TAG_VERSION" != "$POM_VERSION" ]]; then
            echo "Version mismatch: Tag=$TAG_VERSION, POM=$POM_VERSION"
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "Versions match: $TAG_VERSION"
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Fail if versions don't match (for tag pushes)
        if: github.event_name == 'push' && steps.check_version.outputs.changed == 'true'
        run: |
          echo "::error::Version mismatch detected!"
          echo "Tag version: ${{ steps.get_version.outputs.version }}"
          echo "POM version: ${{ steps.get_pom_version.outputs.pom_version }}"
          echo "Please update pom.xml version to match the tag."
          exit 1

  # Job 2: Build and Test
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    needs: validate
    outputs:
      artifact_path: ${{ steps.upload.outputs.artifact_path }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Verify Maven version
        run: mvn --version

      - name: Clean and compile
        run: mvn clean compile -B -V

      - name: Run all tests
        run: mvn test -B -V

      - name: Generate code coverage report
        run: mvn org.jacoco:jacoco-maven-plugin:report -B

      - name: Package for production
        run: mvn package -B -Pproduction -DskipTests

      - name: Verify JAR files
        run: |
          ls -la target/*.jar
          echo "--- Checking main JAR ---"
          jar tf target/muzlik-smp-start-${{ needs.validate.outputs.version }}.jar | head -20
          echo "--- Checking sources JAR ---"
          jar tf target/muzlik-smp-start-${{ needs.validate.outputs.version }}-sources.jar | head -10 || true
          echo "--- Checking javadoc JAR ---"
          jar tf target/muzlik-smp-start-${{ needs.validate.outputs.version }}-javadoc.jar | head -10 || true

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        id: upload
        with:
          name: release-artifacts-${{ needs.validate.outputs.version }}
          path: |
            target/muzlik-smp-start-${{ needs.validate.outputs.version }}.jar
            target/muzlik-smp-start-${{ needs.validate.outputs.version }}-sources.jar
            target/muzlik-smp-start-${{ needs.validate.outputs.version }}-javadoc.jar
            target/site/jacoco/jacoco.xml
            target/site/jacoco/index.html
          retention-days: 30
          if-no-files-found: error

      - name: Upload JaCoCo coverage report
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report-${{ needs.validate.outputs.version }}
          path: target/site/jacoco/
          retention-days: 30

  # Job 3: Create GitHub Release
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [validate, build]
    permissions:
      contents: write
      packages: write
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.create_release == 'true' || github.event_name == 'push'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-artifacts-${{ needs.validate.outputs.version }}
          path: ./release-artifacts

      - name: List downloaded artifacts
        run: ls -la ./release-artifacts

      - name: Generate release notes
        id: generate_notes
        uses: actions/github-script@v7
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        with:
          script: |
            const { execSync } = require('child_process');
            
            // Get commit history since last release
            let commitLog = '';
            try {
              const lastRelease = execSync('git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo ""', { encoding: 'utf8' }).trim();
              if (lastRelease) {
                commitLog = execSync(`git log ${lastRelease}..HEAD --pretty=format:"- %s (%h)"`, { encoding: 'utf8' });
              } else {
                commitLog = execSync('git log --pretty=format:"- %s (%h)"', { encoding: 'utf8' });
              }
            } catch (e) {
              commitLog = execSync('git log --pretty=format:"- %s (%h)" -10', { encoding: 'utf8' });
            }
            
            // Get contributors
            let contributors = '';
            try {
              contributors = execSync('git log --format="%an" | sort -u | tr "\\n" ", " | sed "s/, $//"', { encoding: 'utf8' });
            } catch (e) {
              contributors = 'Contributors';
            }
            
            const releaseNotes = `## 🚀 SMP Start Plugin v${process.env.VERSION}

### 📦 What's Included
- Main plugin JAR (\`muzlik-smp-start-${process.env.VERSION}.jar\`)
- Sources JAR for developers
- Javadoc JAR for API documentation

### 📝 Changes
${commitLog || '- Initial release'}

### 👥 Contributors
${contributors}

### 📊 Build Information
- Java Version: 17
- Maven Build: Production Profile
- Tests: All Passed
- Code Coverage: Generated via JaCoCo

### 🔧 Installation
1. Download \`muzlik-smp-start-${process.env.VERSION}.jar\`
2. Place in your server's \`plugins/\` directory
3. Restart your Minecraft server
4. Configure via \`plugins/SMPStart/config.yml\`

---
*Automatically generated release by GitHub Actions*`;

            core.setOutput('notes', releaseNotes);

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ needs.validate.outputs.version }}
          name: SMP Start Plugin v${{ needs.validate.outputs.version }}
          body: ${{ steps.generate_notes.outputs.notes }}
          draft: false
          prerelease: false
          files: |
            ./release-artifacts/muzlik-smp-start-${{ needs.validate.outputs.version }}.jar
            ./release-artifacts/muzlik-smp-start-${{ needs.validate.outputs.version }}-sources.jar
            ./release-artifacts/muzlik-smp-start-${{ needs.validate.outputs.version }}-javadoc.jar
          generate_release_notes: false
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update release if version unchanged
        if: needs.validate.outputs.version_changed == 'true'
        run: |
          echo "Note: If the version in pom.xml was updated after tag creation,"
          echo "this release will contain the updated artifacts."
          echo "Consider creating a new tag if significant changes were made."

  # Job 4: Post-release validation
  post_release:
    name: Post-Release Validation
    runs-on: ubuntu-latest
    needs: [validate, build, release]
    if: always()
    steps:
      - name: Check previous job results
        run: |
          echo "Validate: ${{ needs.validate.result }}"
          echo "Build: ${{ needs.build.result }}"
          echo "Release: ${{ needs.release.result }}"
          
          if [[ "${{ needs.build.result }}" != "success" ]] || [[ "${{ needs.release.result }}" != "success" && "${{ needs.release.result }}" != "skipped" ]]; then
            echo "::error::Release pipeline had failures!"
            exit 1
          fi
          
          echo "✅ Release completed successfully!"

      - name: Cleanup old artifacts (optional)
        uses: geekyeggo/delete-artifact@v4
        with:
          name: release-artifacts-*
          failOnError: false
