name: CI Build & Test

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:

env:
  MAVEN_OPTS: "-Xmx2g -XX:MaxMetaspaceSize=512m"

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Verify environment
        run: |
          java -version
          mvn --version

      - name: Clean and compile
        run: mvn clean compile -B -V

      - name: Run all tests
        run: mvn test -B -V

      - name: Generate code coverage report
        run: mvn jacoco:report -B

      - name: Package JAR (skip static analysis for CI speed)
        run: mvn package -B -DskipTests -Pci

      - name: Verify JAR creation
        run: |
          ls -la target/*.jar
          echo "Build successful!"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts-${{ github.sha }}
          path: |
            target/muzlik-smp-start-*.jar
            target/site/jacoco/
          retention-days: 7
          if-no-files-found: error

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ github.sha }}
          path: |
            target/surefire-reports/
          retention-days: 7
